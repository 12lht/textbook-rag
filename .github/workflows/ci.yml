name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装 ruff 与 mypy
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      # 只检查 pyproject.toml 里 files 列出的模块，agent_core.py 已在 overrides 里跳过。
      # 不装 requirements.txt：缺依赖时 ignore_missing_imports 会当成 Any，
      # 和本地结果一致（本地装了依赖也不影响这七个纯数据变换模块的判定）。
      - name: mypy
        run: mypy

  offline:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # 默认集合已排除 requires_network（pyproject 的 addopts）。
      # 这里再排掉两类：requires_sample 要 data/uploads 里的真实 PDF（不入库），
      # requires_model 要真实 API key（CI 里没有 secret）。
      # 本地全量：pytest -m "requires_sample or requires_model or requires_network"
      - name: pytest
        run: pytest -m "not requires_sample and not requires_model"
