<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>藏书阁 · 书院</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20width%3D'32'%20height%3D'32'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'6'%20fill%3D'%239c3a29'/%3E%3Cpath%20d%3D'M16%2010.6C14.2%209.3%2011.9%208.7%209.4%208.7c-.9%200-1.7.1-2.4.2v12.6c.7-.1%201.5-.2%202.4-.2%202.5%200%204.8.6%206.6%201.9%201.8-1.3%204.1-1.9%206.6-1.9.9%200%201.7.1%202.4.2V8.9c-.7-.1-1.5-.2-2.4-.2-2.5%200-4.8.6-6.6%201.9Z'%20stroke%3D'%23fffaf2'%20stroke-width%3D'1.8'%20stroke-linejoin%3D'round'%20fill%3D'none'/%3E%3Cpath%20d%3D'M16%2010.6v12.6'%20stroke%3D'%23fffaf2'%20stroke-width%3D'1.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/theme.css" />
  <link rel="stylesheet" href="/static/library.css" />
</head>
<body>
  <div class="topbar">
    <a class="back" href="/">← 回到对话</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="打开分类">☰</button>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.6C10.4 5.3 8.4 4.7 6 4.7c-.8 0-1.5.1-2.2.2v12.9c.7-.1 1.4-.2 2.2-.2 2.4 0 4.4.6 6 1.9 1.6-1.3 3.6-1.9 6-1.9.8 0 1.5.1 2.2.2V4.9C19.5 4.8 18.8 4.7 18 4.7c-2.4 0-4.4.6-6 1.9Z"/>
          <path d="M12 6.6v12.9"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">藏书阁</div>
        <div class="brand-sub">Archive · 分类与入库</div>
      </div>
    </div>
    <div class="who" id="who"></div>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="layout" id="layout">
    <aside class="cats">
      <div class="cats-title">分类</div>
      <div class="cat-list" id="catList"></div>
      <form class="cat-new" id="catForm">
        <input id="catInput" type="text" maxlength="40" placeholder="新建分类，如「移动通信」" autocomplete="off" />
        <button id="catSubmit" type="submit" title="新建分类" aria-label="新建分类">＋</button>
      </form>
      <div class="cat-err" id="catError"></div>
    </aside>

    <main class="docs">
      <div class="docs-head">
        <h1 class="docs-title" id="docsTitle">全部文档</h1>
        <div class="docs-actions">
          <select class="sort-select" id="sortSelect" title="排序方式">
            <option value="number">按编号 / 名称</option>
            <option value="created">按上传时间</option>
          </select>
          <button class="btn-primary" id="uploadButton" type="button">＋ 上传并入库</button>
          <input type="file" id="fileInput" accept=".pdf,.pptx,.docx" multiple hidden />
        </div>
      </div>
      <p class="docs-sub" id="docsSub"></p>

      <div class="bulkbar" id="bulkBar" hidden>
        <span id="bulkCount">已选 0 本</span>
        <select id="bulkCategory"></select>
        <button class="go" id="bulkApply" type="button">移到这个分类</button>
        <button id="bulkClear" type="button">取消选择</button>
      </div>

      <div class="doc-list" id="docList"></div>
    </main>
  </div>

  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h2 class="gate-title">藏书阁需要登录</h2>
      <p class="gate-text" id="gateText">
        游客没有自己的库。回到对话页登录后，上传的教材才会只归你所有。
      </p>
      <a class="gate-link" href="/">回到对话页登录</a>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/library.js"></script>
</body>
</html>
