  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/vendor/katex/auto-render.min.js"></script>
  <script>
    const state = { threadId: null, busy: false, autoFollow: true, lastScrollTop: 0, location: null, locationLabel: '', scope: null, scopeName: '', pending: [] };
    // 「进入某本书的对话」：从知识库分类点进来时 URL 带 scope（分类 id）与 scope_name。
    // 放 state 而不是每次读 URL：退出聚焦要改 URL，读一次存住更直接。
    {
      const params = new URLSearchParams(window.location.search);
      if (params.get('scope')) {
        state.scope = params.get('scope');
        state.scopeName = params.get('scope_name') || '聚焦教材';
      }
    }
    const $ = (selector) => document.querySelector(selector);
    const list = $('#conversationList');
    const messages = $('#messages');
    const chat = $('#chat');
    const welcome = $('#welcome');
    const input = $('#input');
    const send = $('#send');
    const conversationTitle = $('#conversationTitle');
    const hint = $('.hint');
    const scrollBottomButton = $('#scrollBottom');
    const conversationMenu = $('#conversationMenu');
    const locateButton = $('#locate');
    const attachButton = $('#attachButton');
    const attachInput = $('#attachInput');
    const attachBox = $('#composerAttachments');
    const attachWrap = $('#attachWrap');
    const attachMenu = $('#attachMenu');
    const scopeBadge = $('#scopeBadge');

    // --- 移动端抽屉侧栏 ---
    const sidebar = document.querySelector('.sidebar');
    const backdrop = $('#sidebarBackdrop');
    const openSidebar = () => { sidebar.classList.add('open'); backdrop.classList.add('show'); };
    const closeSidebar = () => { sidebar.classList.remove('open'); backdrop.classList.remove('show'); };
    $('#menuBtn').onclick = openSidebar;
    backdrop.onclick = closeSidebar;
    // 选中会话后收起抽屉：手机上屏幕只有一列，列表挡着内容；桌面端 sidebar 不动，收起是空操作。
    const closeSidebarIfMobile = () => { if (window.matchMedia('(max-width: 760px)').matches) closeSidebar(); };

    function renderScopeBadge() {
      // 聚焦徽标：显示当前在哪本书里，点一下退出（清 URL 参数，恢复全书检索）。
      if (!state.scope) { scopeBadge.hidden = true; return; }
      scopeBadge.hidden = false;
      scopeBadge.textContent = `聚焦：《${state.scopeName}》 ✕`;
    }
    scopeBadge.onclick = () => {
      state.scope = null;
      state.scopeName = '';
      window.history.replaceState({}, '', window.location.pathname);
      renderScopeBadge();
    };
    renderScopeBadge();
    const accountName = $('#accountName');
    const accountNote = $('#accountNote');
    const accountAction = $('#accountAction');
    const authModal = $('#authModal');
    const authForm = $('#authForm');
    const authAccount = $('#authAccount');
    const authPassword = $('#authPassword');
    const authInviteField = $('#authInviteField');
    const authInvite = $('#authInvite');
    const authError = $('#authError');
    const authSubmit = $('#authSubmit');
    const HINT_IDLE = 'Enter 发送 · Shift + Enter 换行';
    const LOCATION_KEY = 'agent.location';
    const TOKEN_KEY = 'agent.token';
    // 两个开关的选择**记在浏览器里**，不发到服务端也不写进会话。
    // 理由：这是「我这次想怎么用」的偏好，不是对话内容；写进会话的话
    // 回退到某一轮时会把开关一起回退，用户会以为自己没改过。
    const TOGGLE_KEY = 'agent.toggles';
    const toggles = { reasoning: true, web_search: true };

    // ---------- 身份 ----------
    // 令牌是服务端签发、存在 localStorage 的唯一凭证，前端不自己声称「我是谁」。
    // `identity` 只用于界面展示，权限判断在服务端，别拿它当安全边界。
    let token = readToken();
    let identity = null;
    let authMode = 'login';
    // 注册要不要邀请码。`null` = 还没问过服务端——这是服务端的事实，前端猜不出来。
    let needsInvite = null;
    // 401 只处理一次：一次页面操作可能并发打好几个请求，全都 401 的话
    // 会重复清状态、重复弹提示。处理期间把它挡住。
    let handlingUnauthorized = false;

    function readToken() {
      try { return localStorage.getItem(TOKEN_KEY) || null; } catch (error) { return null; }
    }

    function writeToken(value) {
      token = value;
      try {
        if (value) localStorage.setItem(TOKEN_KEY, value);
        else localStorage.removeItem(TOKEN_KEY);
      } catch (error) {
        // 无痕模式下 localStorage 会抛错。记不住令牌的后果是「刷新后退出登录」，
        // 本次会话仍然可用，不值得打断用户。
      }
    }

    function applyIdentity(me) {
      identity = me && !me.guest
        ? {
            account: me.account,
            guest: false,
            memory_enabled: Boolean(me.memory_enabled),
            // 老服务端不返回这个字段时按「不是主人」处理：宁可少显示一个入口，
            // 也不要让每个人看到一个点进去挨 403 的按钮。
            is_owner: Boolean(me.is_owner),
          }
        : { account: null, guest: true, memory_enabled: false, is_owner: false };
      accountName.textContent = identity.guest ? '未登录' : identity.account;
      // 访客的身份是按浏览器发的（签名 cookie），所以会话只在这里可见；
      // 数据还有 7 天过期。这两句话是「为什么别人看不到我的会话」的答案，
      // 不写清楚会被当成 bug 问。
      accountNote.textContent = identity.guest
        ? '游客模式 · 仅本浏览器可见，7 天后自动清理'
        : '已登录 · 长期记忆已开启';
      accountAction.textContent = identity.guest ? '登录 / 注册' : '退出';
      accountAction.classList.toggle('danger', !identity.guest);
      input.placeholder = identity.guest
        ? '以游客身份提问（仅本浏览器可见）'
        : '问点什么…';
      // 两个侧栏入口都跟着身份走。弹窗要是还开着，里面装的是上一个身份的东西，
      // 必须一起关掉——留着会让人以为看见的是自己新账号的数据。
      syncMemoryEntry();
      syncInviteEntry();
      closeMemory();
      closeInvite();
    }

    // 回到「未选择会话」的空白页。切换身份时必须调用：上一个身份的会话不属于
    // 新身份，留着旧消息会让人以为那是自己的。
    function resetConversationView() {
      state.threadId = null;
      state.autoFollow = true;
      conversationTitle.textContent = '未选择会话';
      messages.innerHTML = '';
      welcome.style.display = 'block';
      updateScrollBottomButton();
    }

    // 所有接口都走这里：统一带令牌、统一处理 401。
    // 401 = 令牌不认了（过期或被撤销）：必须清掉本地令牌、退回游客态，否则界面显示
    // 已登录而每个请求都失败。后端不静默降级成游客，就是为了让这里分辨出「该重新登录了」。
    async function apiFetch(url, options = {}) {
      const headers = Object.assign({}, options.headers || {});
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(url, Object.assign({}, options, { headers }));
      if (response.status === 401 && token) await handleUnauthorized();
      return response;
    }

    async function handleUnauthorized() {
      if (handlingUnauthorized) return;
      handlingUnauthorized = true;
      writeToken(null);
      applyIdentity(null);
      resetConversationView();
      setHint('登录已过期，请重新登录。', true);
      try { await loadConversations(); } finally { handlingUnauthorized = false; }
    }

    // 用原生 fetch 而不是 apiFetch：这个函数本身就是用来判断令牌好坏的，
    // 再走一层 401 处理会绕回来。
    async function refreshIdentity() {
      let me = null;
      try {
        const response = await fetch('/api/auth/me', {
          headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
        if (response.ok) me = await response.json();
        else if (response.status === 401) writeToken(null);
      } catch (error) {
        // 后端没起来：先按游客显示，真正聊天时会在 .hint 上给出连接错误
      }
      applyIdentity(me);
    }

    async function loadRegistrationPolicy() {
      // 原生 fetch：这个端点不需要登录，走 apiFetch 会在 401 时误触发登出逻辑。
      try {
        const response = await fetch('/api/auth/registration-policy');
        if (response.ok) {
          const data = await response.json();
          needsInvite = Boolean(data.needs_invite);
        }
      } catch (error) {
        // 拿不到就先保持 null（界面按「要填」显示），注册时服务端会给出真相。
      }
      syncAuthMode();
    }

    function openAuth(mode) {
      authMode = mode === 'register' ? 'register' : 'login';
      syncAuthMode();
      authError.textContent = '';
      authPassword.value = '';
      authInvite.value = '';
      // 每次点「注册」都重新问一次：上一个页面停留期间可能有人在别处
      // 注册了第一个账号，规矩就变了。这个请求就一次 COUNT，便宜。
      if (authMode === 'register') loadRegistrationPolicy();
      authModal.hidden = false;
      authAccount.focus({ preventScroll: true });
    }

    function closeAuth() {
      authModal.hidden = true;
      authPassword.value = '';
      authInvite.value = '';
      authError.textContent = '';
    }

    function syncAuthMode() {
      document.querySelectorAll('.modal-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.mode === authMode);
      });
      const registering = authMode === 'register';
      authSubmit.textContent = registering ? '注册' : '登录';
      authPassword.placeholder = registering ? '至少 8 位' : '你的密码';
      authPassword.setAttribute('autocomplete', registering ? 'new-password' : 'current-password');
      // 只有「确定不需要码」时才藏起来。还没问到（null）就照常显示——
      // 万一其实要码，藏起来会让用户彻底没法注册；多显示一个可选框是无害的。
      const askInvite = registering && needsInvite !== false;
      authInviteField.hidden = !askInvite;
      // 只有真的知道「这是空站」时才说可以留空。还没问到就别乱许诺，
      // 不然用户会以为不填也能注册，提交后才发现被拦。
      authInvite.placeholder = needsInvite === false ? '第一个账号可以留空' : 'AW-XXXX-XXXX';
    }

    // 登录成功后的收尾：换身份必然换会话列表，所以整页重置再重新拉。
    async function adoptSession(data, message) {
      writeToken(data.token);
      // 注册/登录接口直接把 is_owner 一起返回了，不用为此再打一次 /api/auth/me。
      applyIdentity({
        account: data.user.account,
        guest: false,
        memory_enabled: true,
        is_owner: Boolean(data.is_owner),
      });
      closeAuth();
      resetConversationView();
      await loadConversations();
      setHint(message);
    }

    async function doLogout() {
      try {
        // 登出接口刻意不要求登录态有效：令牌过期时也得能登出，否则用户会卡在一个
        // 点了没反应的按钮上。所以这里失败也不拦着下面清本地状态。
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
      } catch (error) {
        // 忽略：本地状态清掉就够了
      }
      writeToken(null);
      applyIdentity(null);
      resetConversationView();
      await loadConversations();
      setHint('已退出登录，之后的对话不会被记住。');
    }

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const account = authAccount.value.trim();
      const password = authPassword.value;
      authError.textContent = '';
      if (!account || !password) {
        authError.textContent = '账号和密码都要填。';
        return;
      }
      authSubmit.disabled = true;
      try {
        // 走原生 fetch：这里失败了只该显示在弹窗里，不该顺手把外面的界面
        // 也切回游客态（用户只是输错一次密码）。
        const payload = { account, password };
        // 注册才可能带邀请码。**不在前端拦「必须填」**——要不要码只有服务端知道，
        // 这里拦了就会在「第一个账号」上逼人填一个根本不该存在的码。
        if (authMode === 'register') {
          const invite = authInvite.value.trim();
          if (invite) payload.invite = invite;
        }
        const response = await fetch(`/api/auth/${authMode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          authError.textContent = data.detail || `HTTP ${response.status}`;
          // 服务端说「需要邀请码」而我们没显示输入框（策略拿过时了）→ 补显示出来，
          // 别让用户对着「需要邀请码」四个字却无处可填。
          if (response.status === 400 && String(data.detail || '').includes('邀请码')) {
            needsInvite = true;
            syncAuthMode();
          }
          return;
        }
        await adoptSession(data, authMode === 'login' ? '已登录。' : '注册成功，已自动登录。');
      } catch (error) {
        authError.textContent = `无法连接后端：${error.message}`;
      } finally {
        authSubmit.disabled = false;
      }
    });

    document.querySelectorAll('.modal-tab').forEach((tab) => {
      tab.onclick = () => {
        authMode = tab.dataset.mode;
        syncAuthMode();
        authError.textContent = '';
        // 直接点「注册」标签页进来的（没经过 openAuth）也要问一次规矩，
        // 否则 needsInvite 一直是 null，界面只能按「要填」猜。
        if (authMode === 'register' && needsInvite === null) loadRegistrationPolicy();
      };
    });
    $('#authClose').onclick = closeAuth;
    accountAction.onclick = () => {
      if (identity && !identity.guest) doLogout(); else openAuth('login');
    };
    // 点遮罩关闭（点卡片内部不关）
    authModal.addEventListener('mousedown', (event) => {
      if (event.target === authModal) closeAuth();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !authModal.hidden) closeAuth();
    });

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[character]);
    }

    // MinerU 解析出来的公式是**单 `$..$`**，而模型自己写的是 `$$` / `\(..\)`。单 `$` 不能
    // 无条件认（「花了 $5」会变公式），所以只在内容确实像 LaTeX 时才改写成 `\(..\)`——
    // 改写后复用现有定界符，auto-render 不用再加 `$`，货币也不会被误伤。
    function looksLikeMath(body) {
      if (!body || body.length > 300) return false;
      if (/\\[a-zA-Z]{2,}/.test(body)) return true;              // \frac \sqrt \pi
      if (/\^|_/.test(body)) return true;                        // x^2、a_{n}
      if (/[{}]/.test(body) && /[=<>+\-]/.test(body)) return true;
      // 教材里最常见的「单字母变量」：$x$、$n$、$f(x)$、$x+y$。
      // 必须以字母开头，`$5`、`$5.00` 这类金额（数字开头）绝不会命中。
      if (/^[A-Za-z]$/.test(body)) return true;                    // x
      if (/^[A-Za-z][A-Za-z0-9]{0,3}$/.test(body)) return true;     // ab、x1
      if (/^[A-Za-z]\s*\([^()]{0,40}\)$/.test(body)) return true;    // f(x)、P(A)
      if (/^[A-Za-z](\s*[-+*/=<>]\s*[A-Za-z0-9]+)+$/.test(body)) return true;  // x+y、n-1
      return false;
    }

    // 行内代码和围栏代码块都要先护住：代码里的 `$`、`\(` 都不该当公式。
    // 围栏必须在最前面——`\`\`\`` 里可以跨行，行内代码那条 [^`\n] 匹配不到它。
    const MATH_MASK =
      /(```[\s\S]*?```)|(`[^`\n]*`)|(\$\$[\s\S]+?\$\$)|(\\\[[\s\S]+?\\\])|(\\\([\s\S]+?\\\))|(\$(?![\s$])((?:[^$\\\n]|\\.){1,300}?)(?<![\s\\])\$)/g;

    function maskMath(text) {
      const stash = [];
      const masked = String(text ?? '').replace(
        MATH_MASK,
        (match, fence, code, block, bracket, paren, inline, body) => {
          if (fence || code) return match;
          if (inline !== undefined) {
            if (!looksLikeMath(body)) return match;
            stash.push(`\\(${body}\\)`);
            return `@@MATH${stash.length - 1}@@`;
          }
          stash.push(match);
          return `@@MATH${stash.length - 1}@@`;
        },
      );
      return { masked, stash };
    }

    function renderMarkdown(content) {
      const text = String(content ?? '');
      if (!window.marked || !window.DOMPurify) {
        return escapeHtml(text).replace(/\n/g, '<br>');
      }
      // 数学段先抽离成占位符：marked 会把 \( 和 \[ 当转义吃掉反斜杠，
      // KaTeX 就找不到定界符了。占位符是纯文本，能原样穿过 sanitize，
      // 渲染完再把原文（HTML 转义后）放回，交给 renderMathInElement 处理。
      const { masked, stash } = maskMath(text);
      const html = DOMPurify.sanitize(marked.parse(masked, { breaks: true, gfm: true }));
      return html.replace(/@@MATH(\d+)@@/g, (_, index) => escapeHtml(stash[Number(index)] ?? ''));
    }

    // ---------- 引用溯源（C 域） ----------
    // 三个纯文本变换 + 一个渲染函数，只对「助手的回答」生效。

    // 正文里的 [c1] 换成可点的角标。(?!\() 排除 Markdown 链接语法 [c1](url)：
    // 引用编号和链接写法长一样，不排除会把模型贴的正常链接拆坏。
    function decorateCiteCodes(text) {
      return String(text ?? '').replace(/\[(c\d+)\](?!\()/g, '<sup class="cite" data-code="$1">$1</sup>');
    }

    // 正文里的 ![题注](as_xx.png) 换成带签名的图片 URL。urlMap 由引用条目
    // （asset_id → asset_url）拼出来；没有对应条目就原样保留，不让图悄悄消失。
    function inlineAssets(text, urlMap) {
      if (!urlMap) return String(text ?? '');
      return String(text ?? '').replace(/(!\[[^\]]*\]\()(as_[0-9a-f]{4,})\.png(\))/g,
        (whole, pre, assetId, post) => (urlMap[assetId] ? pre + urlMap[assetId] + post : whole));
    }

    function renderAnswer(content, urlMap) {
      return renderMarkdown(inlineAssets(decorateCiteCodes(content), urlMap));
    }

    // 引用条目的一行摘要：书名 · 章节 · 第 X 页 · 图。页码起止相同只写一个。
    // 章节名来自 MinerU 的 title 块，可能带 `<sup>` 之类内联标记，摘要是纯文本，得剥掉。
    function plainLabel(value) {
      return String(value ?? '')
        .replace(/<sup>(.*?)<\/sup>/gi, '^$1')
        .replace(/<sub>(.*?)<\/sub>/gi, '_$1')
        .replace(/<[^>]{1,20}>/g, '')
        .replace(/\$/g, '')
        .trim();
    }

    function sourceMetaText(item) {
      const parts = [];
      const title = plainLabel(item.doc_title);
      const chapter = plainLabel(item.chapter);
      if (title) parts.push(title);
      if (chapter) parts.push(chapter);
      if (item.page_start) {
        parts.push(item.page_end && item.page_end !== item.page_start
          ? `第 ${item.page_start}-${item.page_end} 页`
          : `第 ${item.page_start} 页`);
      }
      const kindText = ({ figure: '图', formula: '公式', table: '表' })[item.kind] || item.kind || '';
      if (kindText) parts.push(kindText);
      return parts.join(' · ') || '教材原文';
    }

    // 从引用条目里拼 asset_id → 签名 URL 的映射，供正文和引用原文出图用。
    function buildAssetMap(items) {
      const map = {};
      (items || []).forEach((item) => {
        if (item.asset_id && item.asset_url) map[item.asset_id] = item.asset_url;
      });
      return map;
    }

    // 引用条目按编号建索引，挂在消息的 contentNode 上（contentNode._citations）。
    // 不渲染任何 DOM：角标在正文里，点角标时用这个索引弹出小窗。
    function buildCiteIndex(contentNode, items) {
      if (!contentNode || !items || !items.length) return;
      const index = {};
      items.forEach((item) => {
        if (item.code) index[item.code] = item;
      });
      contentNode._citations = index;
    }

    // ---------- 引用小窗 ----------
    // 点正文里的 [cN] 角标弹出，全局只存在一个。定位用视口坐标 + position: fixed，
    // 所以聊天区一滚动就必须关掉，否则会悬空在错位的地方。
    function hideCitePopover() {
      const old = document.getElementById('citePopover');
      if (old) old.remove();
      document.querySelectorAll('sup.cite.active').forEach((badge) => badge.classList.remove('active'));
    }

    function showCitePopover(badge, item) {
      hideCitePopover();
      const pop = document.createElement('div');
      pop.id = 'citePopover';
      // class 必须显式挂上：样式全在 .cite-popover 上，漏了它小窗就是一块
      // 没有定位的静态内容，会被塞到页面末尾（视口外）——看起来像「点了没反应」。
      pop.className = 'cite-popover';
      pop._badge = badge;
      const head = document.createElement('div');
      head.className = 'head';
      if (item.code) {
        const badgeEl = document.createElement('span');
        badgeEl.className = 'cite-code';
        badgeEl.textContent = item.code;
        head.appendChild(badgeEl);
      }
      const meta = document.createElement('span');
      meta.className = 'source-meta';
      meta.textContent = sourceMetaText(item);
      head.appendChild(meta);
      pop.appendChild(head);
      const text = typeof item.content === 'string' ? item.content.trim() : '';
      if (text) {
        const body = document.createElement('div');
        body.className = 'body';
        // 实时条目的图引用还是占位文件名，用条目自带的签名 URL 换掉；
        // 历史条目的图已被服务端内联成真 URL，这里原样通过。
        body.innerHTML = renderMarkdown(inlineAssets(decorateCiteCodes(text), buildAssetMap([item])));
        // MinerU 的公式是单 $..$，要靠 KaTeX 才成公式——正文章节渲染完都会走
        // beautifyMath，小窗以前漏了这一步，原文里的公式一直是裸 LaTeX。
        beautifyMath(body);
        pop.appendChild(body);
      } else if (item.asset_url) {
        // MinerU 的 figure 块可能是纯图无题注，content 为空：直接把图放出来，
        // 否则点开是一块空白，等于「引用了但看不到东西」。
        const body = document.createElement('div');
        body.className = 'body';
        const img = document.createElement('img');
        img.src = item.asset_url;
        img.alt = `第 ${item.page_start || '?'} 页的插图`;
        body.appendChild(img);
        pop.appendChild(body);
      }
      document.body.appendChild(pop);
      // 先挂上 DOM 量出尺寸再定位：默认弹在角标下方，放不下就翻到上方，
      // 左右夹在视口内。
      const rect = badge.getBoundingClientRect();
      const width = pop.offsetWidth;
      const height = pop.offsetHeight;
      const left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8));
      let top = rect.bottom + 8;
      if (top + height > window.innerHeight - 8) {
        top = Math.max(8, rect.top - height - 8);
      }
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
      badge.classList.add('active');
    }

    function toggleCitePopover(badge) {
      const contentNode = badge.closest('.message-content');
      const item = contentNode?._citations?.[badge.dataset.code];
      if (!item) return; // 引用事件还没到（流式期间），点了没东西可看
      const existing = document.getElementById('citePopover');
      if (existing && existing._badge === badge) {
        hideCitePopover();
        return;
      }
      showCitePopover(badge, item);
    }

    // 点角标开小窗；点小窗和角标以外的地方、聊天区滚动、按 Esc，都关闭。
    messages.addEventListener('click', (event) => {
      const badge = event.target.closest('sup.cite');
      if (badge) toggleCitePopover(badge);
    });
    document.addEventListener('mousedown', (event) => {
      if (event.target.closest('#citePopover') || event.target.closest('sup.cite')) return;
      hideCitePopover();
    }, true);
    chat.addEventListener('scroll', () => hideCitePopover(), { passive: true });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') hideCitePopover();
    });

    // 状态和错误都显示在输入框下面那行小字上，出错时必须让用户看见，
    // 否则接口失败会表现为「点了没反应」。
    function setHint(text, isError = false) {
      hint.textContent = text || HINT_IDLE;
      hint.classList.toggle('error', Boolean(text) && isError);
    }

    // 忙碌状态和提示文案必须分开：出错时只解除忙碌，不能顺手把错误文案清掉。
    function setBusy(busy) {
      send.disabled = busy;
      input.disabled = busy;
      state.busy = busy;
      document.querySelectorAll('.rewind').forEach((button) => { button.disabled = busy; });
    }

    function setStatus(text, busy = false) {
      setBusy(busy);
      setHint(text);
    }

    // ---------- 位置：浏览器授权优先，失败降级为用户手选 ----------
    // 位置只由前端提供，服务端不用 IP 猜（多用户部署会把所有人定位到服务器所在地）。
    // 手选城市优先于授权坐标（坐标可能来自 VPN 或粗粒度定位），优先级由 service 裁决。

    function loadStoredLocation() {
      try {
        const raw = localStorage.getItem(LOCATION_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        return saved && typeof saved === 'object' && saved.location ? saved : null;
      } catch (error) {
        return null; // 存的东西坏了就当没存过，不影响使用
      }
    }

    function renderLocateButton() {
      locateButton.textContent = state.locationLabel || '定位';
      locateButton.classList.toggle('set', Boolean(state.location));
      locateButton.title = state.locationLabel
        ? `当前位置：${state.locationLabel} · 点击重新设置`
        : '点击设置位置（浏览器授权，或手动输入城市）';
    }

    function setLocation(location, label) {
      state.location = location;
      state.locationLabel = label || '';
      try {
        if (location) {
          localStorage.setItem(LOCATION_KEY, JSON.stringify({ location, label: state.locationLabel }));
        } else {
          localStorage.removeItem(LOCATION_KEY);
        }
      } catch (error) {
        // 隐私模式下 localStorage 会抛错。记不住不影响这次会话，忽略。
      }
      renderLocateButton();
    }

    // 坐标换城市名。走 /api/location 而不是等聊天接口返回，是因为聊天是 SSE 流，
    // 坐标在那一轮里只会进模型上下文，前端拿不到解析结果去回显。
    function locateByCoordinates() {
      return new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const { latitude, longitude } = position.coords;
            try {
              const response = await apiFetch('/api/location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude, longitude })
              });
              if (!response.ok) throw new Error(await readError(response, '定位解析失败'));
              const data = await response.json();
              if (!data.location) {
                setHint('没能从坐标解析出城市。', true);
                resolve(false);
                return;
              }
              setLocation({ latitude, longitude }, data.location);
              setHint('');
              resolve(true);
            } catch (error) {
              setHint(`定位解析失败：${error.message}`, true);
              resolve(false);
            }
          },
          (error) => {
            setHint(error && error.code === 1
              ? '你拒绝了定位授权。'
              : '无法获取定位。', true);
            resolve(false);
          },
          { timeout: 8000, maximumAge: 600000 }
        );
      });
    }

    // 手选兜底。留空 = 清除已设置的位置。
    function chooseCityByHand(reason) {
      const entered = window.prompt(`${reason}\n\n留空则清除已设置的位置。`, state.locationLabel || '');
      if (entered === null) return; // 用户取消，保持原状
      const city = entered.trim();
      if (!city) { setLocation(null, ''); setHint('已清除位置。'); return; }
      setLocation({ city }, city);
      setHint(`位置已设为 ${city}。`);
    }

    locateButton.onclick = async () => {
      if (!navigator.geolocation) { chooseCityByHand('当前浏览器不支持自动定位。'); return; }
      setHint('正在请求定位授权…');
      if (!await locateByCoordinates()) {
        chooseCityByHand('自动定位没有成功，请手动输入你所在的城市。');
      }
    };

    // 页面加载时：记住过就直接用；否则只在「用户以前就已授权」时静默取一次，
    // 不在页面刚打开就弹权限框出来。
    async function restoreLocation() {
      const saved = loadStoredLocation();
      if (saved) { setLocation(saved.location, saved.label); return; }
      if (!navigator.geolocation || !navigator.permissions?.query) return;
      try {
        const status = await navigator.permissions.query({ name: 'geolocation' });
        if (status.state === 'granted') await locateByCoordinates();
      } catch (error) {
        // 部分浏览器不支持查询 geolocation 权限（含 file:// 与本机 http），静默跳过
      }
    }

    // ------------------------------------------------------------------
    // 深度思考 / 联网搜索 两个开关
    // ------------------------------------------------------------------
    // 选择存在浏览器里，每次发消息带上。服务端不记——它是「这一轮怎么用」，
    // 不是对话状态，写进会话会让回退把开关也一起回退。
    function restoreToggles() {
      try {
        const saved = JSON.parse(localStorage.getItem(TOGGLE_KEY) || '{}');
        // 只认布尔值：存过别的东西（比如旧版本存的是字符串）就当没存过，
        // 照默认「都开」走。宁可丢掉一次选择，也不要让按钮显示成 undefined。
        if (typeof saved.reasoning === 'boolean') toggles.reasoning = saved.reasoning;
        if (typeof saved.web_search === 'boolean') toggles.web_search = saved.web_search;
      } catch (error) {
        // 坏 JSON 不影响使用，用默认值
      }
    }

    function saveToggles() {
      localStorage.setItem(TOGGLE_KEY, JSON.stringify(toggles));
    }

    function paintToggles() {
      [['#toggleReasoning', 'reasoning'], ['#toggleWeb', 'web_search']].forEach(([selector, key]) => {
        const button = $(selector);
        button.classList.toggle('active', toggles[key]);
        button.setAttribute('aria-pressed', String(toggles[key]));
      });
    }

    function bindToggle(selector, key) {
      $(selector).onclick = () => {
        toggles[key] = !toggles[key];
        saveToggles();
        paintToggles();
        input.focus({ preventScroll: true });
      };
    }

    // 问服务端「这两个开关现在真的有用吗」，没用的置灰。
    // 不做这步的话，按钮点下去没有任何效果（比如换了个不支持关推理的模型），
    // 用户只会以为模型坏了——宁可提前把按钮变成灰色。
    async function loadCapabilities() {
      let caps;
      try {
        const response = await apiFetch('/api/capabilities');
        if (!response.ok) return;
        caps = await response.json();
      } catch (error) {
        return;  // 拿不到就按「都可用」处理，不要因为一个能力查询挡住两个按钮
      }
      if (!caps.reasoning_toggleable) {
        $('#toggleReasoning').disabled = true;
        $('#toggleReasoning').title = '当前模型不支持关闭深度思考';
      }
      if (!caps.web_search_available) {
        // 同时把开关拨到关：工具没配 key 时留在工具表里只是让模型白调一次，
        // 拿到一句「搜索服务未配置」。摘掉更干净。
        toggles.web_search = false;
        $('#toggleWeb').disabled = true;
        $('#toggleWeb').title = '服务端未配置搜索服务，联网不可用';
      }
      paintToggles();
    }

    // 把后端返回的 detail 取出来，附加到错误信息上。
    async function readError(response, fallback) {
      try {
        const problem = await response.json();
        const detail = problem && problem.detail;
        if (typeof detail === 'string' && detail) {
          return `HTTP ${response.status}：${detail}`;
        }
      } catch (error) {
        // 后端没有返回 JSON，用兜底文案
      }
      return fallback || `HTTP ${response.status}`;
    }

    // 滚动只发生在 .chat 内部：页面本身不滚动，所以侧边栏、顶栏和输入框始终固定。
    function isNearBottom(threshold = 120) {
      return chat.scrollHeight - chat.scrollTop - chat.clientHeight <= threshold;
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    // 只要不在底部就显示「回到底部」按钮
    function updateScrollBottomButton() {
      scrollBottomButton.classList.toggle('visible', !isNearBottom());
    }

    scrollBottomButton.onclick = () => {
      state.autoFollow = true;
      scrollToBottom();
      updateScrollBottomButton();
    };

    // 是否跟随由真实滚动行为决定：向上滚离底部就停止，重新接近底部就恢复。
    // 不能在每个流式分片里现算 isNearBottom()——跟随滚动本身就会把跟随关掉。
    chat.addEventListener('scroll', () => {
      const currentScrollTop = chat.scrollTop;
      if (currentScrollTop < state.lastScrollTop - 2 && !isNearBottom()) {
        state.autoFollow = false;
      } else if (isNearBottom()) {
        state.autoFollow = true;
      }
      state.lastScrollTop = currentScrollTop;
      updateScrollBottomButton();
    }, { passive: true });

    // LaTeX 公式渲染：教材与模型的回答里大量 $$..$$ / \(..\)。
    // 单个 $ 不启用（会把「花了 $5」之类误伤成公式）。在 DOMPurify 之后调用，
    // KaTeX 生成的节点不再过 sanitize。
    function beautifyMath(el) {
      if (!window.renderMathInElement) return;
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        throwOnError: false,
      });
    }

    function addMessage(role, content, activity = false, operations = [], turn = null, citations = null, images = []) {
      const shouldFollow = state.autoFollow;
      const item = document.createElement('article');
      item.className = `message ${role}`;
      const trace = role === 'assistant'
        ? '<details class="trace" hidden><summary>模型思考</summary><div class="trace-list"></div></details>'
        : '';
      const rewindRow = role === 'user' && turn !== null
        ? '<div class="message-actions"><button type="button" class="rewind" title="删除这条消息及其之后的全部对话">回退到发送这条之前</button></div>'
        : '';
      // 角色标签跟界面语言保持一致：原来写死 You/Agent，中文界面里显得是别的东西。
      const roleLabel = role === 'user' ? '你' : '教材助手';
      const avatarText = role === 'user' ? '我' : '教';
      item.innerHTML = `<div class="avatar">${avatarText}</div><div><div class="message-role">${roleLabel}</div>${trace}<div class="message-content${activity ? ' activity' : ''}"></div>${rewindRow}</div>`;
      const contentNode = item.querySelector('.message-content');
      // 助手的回答走 renderAnswer：[cN] 变可点角标、图引用换签名 URL。
      // urlMap 只在历史消息带引用条目时非空（实时流是先出正文、后到引用事件）。
      const urlMap = buildAssetMap(citations);
      contentNode.innerHTML = role === 'assistant'
        ? renderAnswer(content, urlMap)
        : renderMarkdown(content);
      // 图片放在文字上面：读的时候先看到「问的是哪张图」，再看问题。
      if (images.length) {
        const grid = document.createElement('div');
        grid.className = 'message-attachments';
        images.forEach((src) => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = '我上传的图片';
          img.loading = 'lazy';
          grid.appendChild(img);
        });
        contentNode.insertBefore(grid, contentNode.firstChild);
      }
      beautifyMath(contentNode);
      contentNode.trace = item.querySelector('.trace');
      contentNode.traceList = item.querySelector('.trace-list');
      operations.forEach((operation) => {
        // 历史里的思维链（kind=reasoning）整段拿回来，一次性填进折叠块。
        if (operation.kind === 'reasoning') {
          appendReasoning(addReasoning(contentNode), operation.text || '');
          return;
        }
        // 工具返回：按 status 分「完成 / 失败」，和历史流走同一套渲染。
        if (operation.kind === 'result') {
          addToolResult(contentNode, operation.tool, operation.status, operation.content);
          return;
        }
        const details = operation.kind === 'call' && operation.args && Object.keys(operation.args).length
          ? JSON.stringify(operation.args)
          : '';
        addTrace(contentNode, `调用工具：${operation.tool}`, details);
      });
      // 历史消息自带的引用条目 → 建索引（点正文角标弹小窗，C5：刷新后引用还在）。
      if (role === 'assistant' && citations && citations.length) {
        buildCiteIndex(contentNode, citations);
      }
      const rewindButton = item.querySelector('.rewind');
      if (rewindButton) rewindButton.onclick = () => rewindTo(turn);
      messages.appendChild(item);
      welcome.style.display = 'none';
      if (shouldFollow) scrollToBottom();
      return contentNode;
    }

    // 按历史渲染消息，同时给每条用户消息标上它的序号（从 0 开始），回退要用。
    function renderHistory(history) {
      messages.innerHTML = '';
      let userTurn = 0;
      history.forEach((message) => {
        const isUser = message.role === 'user';
        // 历史里的图片是后端签好名的地址（见 service._decorate_history），直接能加载。
        addMessage(message.role, message.content, false, message.operations || [],
          isUser ? userTurn : null, message.citations || null,
          (message.attachments || []).map((item) => item.url));
        if (isUser) userTurn += 1;
      });
      if (!history.length) welcome.style.display = 'block';
      updateScrollBottomButton();
    }

    function addTrace(node, label, details = '', failed = false) {
      if (!node?.traceList) return;
      node.trace.hidden = false;
      const event = document.createElement('div');
      event.className = failed ? 'trace-event trace-failed' : 'trace-event';
      event.textContent = details ? `${label} · ${details}` : label;
      node.traceList.appendChild(event);
    }

    // 工具成功和失败必须长得不一样：后端在 tool_result 里发了 status，丢了它就会把
    // 「工具失败」渲染成「工具完成」。
    // content 是返回原文（已截断），做成默认收起的折叠块——教材检索一返回就是几千字。
    function addToolResult(node, tool, status, content = '') {
      const failed = status === 'error';
      const text = String(content || '').trim();
      if (!text) {
        addTrace(node, `${failed ? '工具失败' : '工具完成'}：${tool}`, '', failed);
        return;
      }
      if (!node?.traceList) return;
      node.trace.hidden = false;
      const box = document.createElement('details');
      box.className = failed ? 'trace-tool-result trace-failed' : 'trace-tool-result';
      const summary = document.createElement('summary');
      summary.textContent = `${failed ? '工具失败' : '工具完成'}：${tool}（返回 ${text.length} 字）`;
      const body = document.createElement('div');
      body.className = 'trace-tool-result-body';
      body.textContent = text;
      box.append(summary, body);
      node.traceList.appendChild(box);
    }

    // 思维链做成折叠块而不是平铺一行：它比正文长一个量级，平铺会把工具调用挤到看不见。
    // summary 上带实时字数，既能看出「它正在想」，又不占地方。
    function addReasoning(node, text = '') {
      if (!node?.traceList) return null;
      node.trace.hidden = false;
      const box = document.createElement('details');
      box.className = 'trace-reasoning';
      box.innerHTML = '<summary></summary><div class="trace-reasoning-body"></div>';
      box.summary = box.querySelector('summary');
      box.body = box.querySelector('.trace-reasoning-body');
      box.chars = 0;
      box.head = '';
      node.traceList.appendChild(box);
      if (text) appendReasoning(box, text);
      return box;
    }

    function appendReasoning(box, text) {
      if (!box || !text) return;
      // 用 appendChild(TextNode) 而不是 `textContent +=`：后者每来一片都要把
      // 整块内容读出来再写回去，几百个分片下来会退化成 O(n²)。
      box.body.appendChild(document.createTextNode(text));
      box.chars += text.length;
      // 只留开头一小截做预览，别让 summary 随着思维链一起变长。
      box.head = (box.head + text).slice(0, 40);
      const preview = box.head.replace(/\s+/g, ' ').trim();
      const more = box.chars > preview.length ? '…' : '';
      box.summary.textContent = `思考过程（${box.chars} 字）${preview}${more}`;
    }

    async function loadConversations() {
      // 列表每次都是整块重建，菜单里缓存的 row 会变成脱离 DOM 的旧节点；
      // 顺手收起来，避免「重命名」改到一个看不见的行上。
      closeConversationMenu();
      let data;
      try {
        const response = await apiFetch('/api/conversations');
        if (!response.ok) {
          setHint(`会话列表加载失败：${await readError(response, '会话列表加载失败')}`, true);
          return;
        }
        data = await response.json();
      } catch (error) {
        setHint(`无法连接后端：${error.message}`, true);
        return;
      }
      const activeConversation = data.find((conversation) => conversation.thread_id === state.threadId);
      conversationTitle.textContent = activeConversation ? activeConversation.summary : '未选择会话';
      list.innerHTML = '';
      data.forEach((conversation) => {
        const row = document.createElement('div');
        row.className = 'conversation-item';
        const button = document.createElement('button');
        button.className = `conversation ${conversation.thread_id === state.threadId ? 'active' : ''}`;
        button.innerHTML = `<div class="conversation-title"></div><div class="conversation-count">${conversation.message_count} 条消息</div>`;
        button.querySelector('.conversation-title').textContent = conversation.summary;
        button.onclick = () => selectConversation(conversation.thread_id);
        // 删除和重命名都收进右键菜单，列表里不再常住一个删除按钮
        row.addEventListener('contextmenu', (event) => {
          event.preventDefault();
          openConversationMenu(event.clientX, event.clientY, row, conversation);
        });
        row.append(button);
        list.appendChild(row);
      });
    }

    async function deleteConversation(threadId, summary) {
      if (!window.confirm(`确定删除“${summary}”吗？此操作不可恢复。`)) return;
      const response = await apiFetch(`/api/conversations/${encodeURIComponent(threadId)}`, { method: 'DELETE' });
      if (!response.ok) {
        setHint(`删除失败：${await readError(response, '删除失败')}`, true);
        return;
      }
      if (state.threadId === threadId) {
        state.threadId = null;
        state.autoFollow = true;
        conversationTitle.textContent = '未选择会话';
        messages.innerHTML = '';
        welcome.style.display = 'block';
        updateScrollBottomButton();
      }
      await loadConversations();
      setStatus('');
    }

    // ---------- 会话右键菜单（重命名 / 删除） ----------
    let menuTarget = null;

    function openConversationMenu(x, y, row, conversation) {
      menuTarget = { row, conversation };
      conversationMenu.hidden = false;
      // 先显示再量尺寸，才拿得到菜单自身的宽高来做视口内收边
      const rect = conversationMenu.getBoundingClientRect();
      const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
      const top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8));
      conversationMenu.style.left = `${left}px`;
      conversationMenu.style.top = `${top}px`;
    }

    function closeConversationMenu() {
      conversationMenu.hidden = true;
      menuTarget = null;
    }

    async function renameConversation(threadId, title) {
      try {
        const response = await apiFetch(`/api/conversations/${encodeURIComponent(threadId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!response.ok) {
          const detail = await readError(response, '重命名失败');
          // 405 说明路径存在、只是这个 HTTP 方法没注册——一般是后端进程还是改 PATCH
          // 之前启动的那个，重启 uvicorn 才会生效（和回退接口的 404 是同一类问题）。
          throw new Error(response.status === 405
            ? `${detail}。后端可能是在这次改动之前启动的，重启 uvicorn 后重命名接口才会生效。`
            : detail);
        }
        await loadConversations();
        // 和回退一致：不在提示行播报成功，直接还原成默认输入提示
        setStatus('');
      } catch (error) {
        setHint(`重命名失败：${error.message}`, true);
        await loadConversations();
      }
    }

    // 就地改标题：把整行的内容换成输入框（不能把 input 塞进 .conversation 按钮里，
    // 那样点输入框会连带触发按钮的选中逻辑）。提交或取消后靠 loadConversations 重建整行。
    function startInlineRename(row, conversation) {
      const field = document.createElement('input');
      field.className = 'conversation-rename';
      field.type = 'text';
      field.maxLength = 30;
      field.value = conversation.summary;
      field.setAttribute('aria-label', '会话标题');
      row.replaceChildren(field);
      field.focus();
      field.select();

      let settled = false;
      const commit = async () => {
        if (settled) return;
        settled = true;
        const title = field.value.trim();
        if (!title || title === conversation.summary) {
          await loadConversations();
          return;
        }
        await renameConversation(conversation.thread_id, title);
      };
      const cancel = async () => {
        if (settled) return;
        settled = true;
        await loadConversations();
      };

      field.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { event.preventDefault(); commit(); }
        else if (event.key === 'Escape') { event.preventDefault(); cancel(); }
      });
      // 点走即提交，和常见的待办应用一致；settled 保证 Enter 之后 blur 不会再提交一次
      field.addEventListener('blur', () => { commit(); });
    }

    conversationMenu.querySelector('[data-action="rename"]').onclick = () => {
      const target = menuTarget;
      closeConversationMenu();
      if (target) startInlineRename(target.row, target.conversation);
    };

    conversationMenu.querySelector('[data-action="delete"]').onclick = () => {
      const target = menuTarget;
      closeConversationMenu();
      if (target) deleteConversation(target.conversation.thread_id, target.conversation.summary);
    };

    // 左键点别处、滚轮、Esc、改窗口大小、失焦，都把菜单收起来。
    // 不用 scroll：它是异步派发的，打开菜单之前那次滚动的 scroll 可能晚到、把菜单立刻关掉。
    document.addEventListener('mousedown', (event) => {
      if (!event.target.closest('#conversationMenu')) closeConversationMenu();
    }, true);
    document.addEventListener('wheel', () => closeConversationMenu(), { passive: true });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeConversationMenu();
    });
    window.addEventListener('resize', () => closeConversationMenu());
    window.addEventListener('blur', () => closeConversationMenu());

    async function selectConversation(threadId) {
      closeSidebarIfMobile();
      setStatus('正在加载历史…', true);
      state.autoFollow = true;
      const response = await apiFetch(`/api/conversations/${encodeURIComponent(threadId)}/messages`);
      if (!response.ok) {
        setHint(`加载历史失败：${await readError(response, '加载历史失败')}`, true);
        setBusy(false);
        return;
      }
      const data = await response.json();
      state.threadId = threadId;
      renderHistory(data.messages);
      await loadConversations();
      setStatus('');
    }

    // 回退：删掉这条用户消息以及它之后的全部对话，并把原文放回输入框方便改完重发。
    async function rewindTo(turn) {
      if (state.busy) return;
      if (state.threadId === null) {
        setHint('回退失败：当前没有活动会话。', true);
        return;
      }
      if (!window.confirm('回退到这条消息之前？这条消息以及它之后的对话都会被删除，原文会放回输入框。')) return;
      setStatus('正在回退…', true);
      try {
        const response = await apiFetch(`/api/conversations/${encodeURIComponent(state.threadId)}/rewind`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ turn })
        });
        if (!response.ok) {
          const detail = await readError(response, '回退失败');
          throw new Error(response.status === 404
            ? `${detail}。如果后端是在这次改动之前启动的，重启 uvicorn 后接口才会生效。`
            : detail);
        }
        const data = await response.json();
        state.autoFollow = true;
        renderHistory(data.messages);
        input.value = data.text || '';
        input.style.height = 'auto';
        input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
        input.focus({ preventScroll: true });
        await loadConversations();
        // 不额外播报「已回退…」：原文已经在输入框里了，直接把提示行还原成默认输入提示
        setStatus('');
      } catch (error) {
        setBusy(false);
        setHint(`回退失败：${error.message}`, true);
      }
    }

    async function newConversation() {
      closeSidebarIfMobile();
      try {
        const response = await apiFetch('/api/conversations', { method: 'POST' });
        if (!response.ok) throw new Error(await readError(response, '新建会话失败'));
        const data = await response.json();
        state.threadId = data.thread_id;
        state.autoFollow = true;
        conversationTitle.textContent = data.summary;
        messages.innerHTML = '';
        welcome.style.display = 'block';
        updateScrollBottomButton();
        await loadConversations();
        setStatus('');
        input.focus({ preventScroll: true });
      } catch (error) {
        setHint(`新建会话失败：${error.message}`, true);
      }
    }

    // ------------------------------------------------------------------
    // 会话内图片附件
    // ------------------------------------------------------------------
    // 缩图放前端做：一张手机截图 3MB，base64 后更大；缩到长边 1024 通常只剩一两百 KB。
    // 而模型的视觉 token 封顶在 1024/张，传更大的图不会看得更清，只会传得更慢。
    const IMAGE_MAX_SIDE = 1024;
    const IMAGE_QUALITY = 0.9;
    const MAX_PENDING_IMAGES = 8;

    async function shrinkImage(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, IMAGE_MAX_SIDE / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (bitmap.close) bitmap.close();
      // 统一转 JPEG：PNG 截图转过来体积小一个量级，透明通道对教材截图没有意义。
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', IMAGE_QUALITY));
      return blob || file;
    }

    function renderPending() {
      attachBox.innerHTML = '';
      attachBox.hidden = state.pending.length === 0;
      state.pending.forEach((item) => {
        const chip = document.createElement('div');
        chip.className = 'attachment-chip' + (item.uploading ? ' loading' : '');
        const img = document.createElement('img');
        img.src = item.preview;
        img.alt = '待发送的图片';
        chip.appendChild(img);
        // 上传中不给「移除」按钮：这时点掉会让已经飞出去的请求落地到一个已删除的槽位。
        if (!item.uploading) {
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'attachment-remove';
          remove.textContent = '×';
          remove.title = '移除这张图';
          remove.onclick = () => {
            state.pending = state.pending.filter((entry) => entry !== item);
            renderPending();
          };
          chip.appendChild(remove);
        }
        attachBox.appendChild(chip);
      });
    }

    async function addImageFiles(fileList) {
      const files = Array.from(fileList || []).filter((file) => file.type.startsWith('image/'));
      if (!files.length) return;
      // 串行上传而不是 Promise.all：一次贴 8 张时并发打满上传带宽，反而每张都更慢，
      // 而且失败时会给用户冒出 8 条错误提示。
      for (const file of files) {
        if (state.pending.length >= MAX_PENDING_IMAGES) {
          setHint(`一次最多 ${MAX_PENDING_IMAGES} 张图`, true);
          break;
        }
        const slot = { preview: URL.createObjectURL(file), uploading: true, att_id: null };
        state.pending.push(slot);
        renderPending();
        try {
          const blob = await shrinkImage(file);
          const form = new FormData();
          // 文件名固定：后端按文件头判断真实格式，不信名字也不信 Content-Type。
          form.append('file', blob, 'image.jpg');
          const response = await apiFetch('/api/attachments', { method: 'POST', body: form });
          if (!response.ok) throw new Error(await readError(response, '上传失败'));
          const data = await response.json();
          slot.att_id = data.att_id;
          slot.uploading = false;
        } catch (error) {
          state.pending = state.pending.filter((entry) => entry !== slot);
          setHint(`图片上传失败：${error.message}`, true);
        }
        renderPending();
      }
      input.focus({ preventScroll: true });
    }

    async function sendMessage(text) {
      if (state.busy) return;
      // 只发图不写字是合法的（「这题怎么做」可以不写），但不能两样都没有。
      const images = state.pending.filter((item) => !item.uploading && item.att_id);
      if (!text && !images.length) return;
      if (state.pending.some((item) => item.uploading)) {
        setHint('图片还在上传，稍等一下再发', true);
        return;
      }
      state.autoFollow = true;
      addMessage('user', text, false, [], messages.querySelectorAll('.message.user').length, null,
        images.map((item) => item.preview));
      // 清空待发送区，但**不** revoke 这些 blob URL：消息气泡里还在用它们显示。
      // 页面刷新时浏览器自然回收，比手动管理引用计数省事且不会闪白。
      state.pending = [];
      renderPending();
      input.value = '';
      input.style.height = 'auto';
      setStatus('正在思考…', true);
      let assistantNode = null;
      let assistantText = '';
      let streamFailed = false;
      // 本轮的 asset_id → 签名 URL 映射。citations 事件在正文生成完之后才到
      // （后端要在流结束前才凑齐全部引用），到了以后要把整段正文重渲染一遍，
      // 正文里的图才能真的显示出来。
      let assetMap = {};
      // 当前这一轮模型的思考块。模型一轮里「先想、再答」，调完工具进入下一轮时
      // 要另起一块，所以 tool_call 那里会把它清掉（见下）。
      let reasoningBox = null;
      try {
        const response = await apiFetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // 请求体里**没有** user_id：身份只认 Authorization 头里的令牌。
          // 以前这里带一个写死的 user_id，改成可编辑就等于谁都能读别人的会话。
          body: JSON.stringify({
            message: text,
            thread_id: state.threadId,
            location: state.location,
            reasoning: toggles.reasoning,
            web_search: toggles.web_search,
            scope_category_id: state.scope || null,
            attachments: images.map((item) => item.att_id),
          })
        });
        if (!response.ok) throw new Error(await readError(response, '请求失败'));
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop();
          for (const block of blocks) {
            const line = block.split('\n').find((part) => part.startsWith('data: '));
            if (!line) continue;
            const event = JSON.parse(line.slice(6));
            if (event.type === 'conversation') {
              state.threadId = event.thread_id;
            } else if (event.type === 'title') {
              conversationTitle.textContent = event.title;
            } else if (event.type === 'reasoning_delta') {
              if (!assistantNode) assistantNode = addMessage('assistant', '');
              if (!reasoningBox) reasoningBox = addReasoning(assistantNode);
              appendReasoning(reasoningBox, event.content);
              if (state.autoFollow) scrollToBottom();
            } else if (event.type === 'tool_call') {
              // 这条之后模型要重新开始推理，下一段思维链另起一块。
              reasoningBox = null;
              if (!assistantNode) assistantNode = addMessage('assistant', '');
              (event.calls || [{ name: event.tool, args: {} }]).forEach((call) => {
                addTrace(assistantNode, `调用工具：${call.name}`, Object.keys(call.args || {}).length ? JSON.stringify(call.args) : '');
              });
              setStatus(`正在调用工具：${event.tool}…`, true);
            } else if (event.type === 'tool_result') {
              if (!assistantNode) assistantNode = addMessage('assistant', '');
              addToolResult(assistantNode, event.tool, event.status, event.content);
            } else if (event.type === 'assistant_delta') {
              if (!assistantNode) assistantNode = addMessage('assistant', '');
              assistantText += event.content;
              assistantNode.innerHTML = renderAnswer(assistantText, assetMap);
              if (state.autoFollow) scrollToBottom();
            } else if (event.type === 'assistant') {
              if (!assistantNode) assistantNode = addMessage('assistant', '');
              assistantText = event.content;
              assistantNode.innerHTML = renderAnswer(assistantText, assetMap);
            } else if (event.type === 'citations') {
              // 流结束前最后一批结构化事件：先攒 asset 映射，再把正文重渲染
              // 一遍（图从占位文件名变成真 URL），最后给角标建索引供小窗查。
              assetMap = buildAssetMap(event.items);
              if (!assistantNode) assistantNode = addMessage('assistant', '');
              if (assistantText) assistantNode.innerHTML = renderAnswer(assistantText, assetMap);
              beautifyMath(assistantNode);
              buildCiteIndex(assistantNode, event.items || []);
            } else if (event.type === 'error') {
              if (!assistantNode) assistantNode = addMessage('assistant', '');
              assistantNode.innerHTML = renderMarkdown(event.message);
              streamFailed = true;
              setHint(`服务端出错：${event.message}`, true);
            }
          }
        }
        await loadConversations();
        // 无引用的回答没有 citations 事件可借力，收尾时统一补一次公式渲染
        if (assistantNode) beautifyMath(assistantNode);
        if (streamFailed) setBusy(false); else setStatus('');
      } catch (error) {
        addMessage('assistant', `请求失败：${error.message}`);
        setBusy(false);
        setHint(`请求失败：${error.message}`, true);
      } finally {
        setBusy(false);
        input.focus({ preventScroll: true });
      }
    }

    // ------------------------------------------------------------------
    // 附件入口：点「+」出一张小菜单，再选怎么加
    // ------------------------------------------------------------------
    function openAttachMenu() {
      attachMenu.hidden = false;
      attachButton.setAttribute('aria-expanded', 'true');
    }
    function closeAttachMenu() {
      attachMenu.hidden = true;
      attachButton.setAttribute('aria-expanded', 'false');
    }

    attachButton.addEventListener('click', () => {
      if (attachMenu.hidden) openAttachMenu(); else closeAttachMenu();
    });

    // 点面板外面收起。用 mousedown 而不是 click：拖拽选文件时是先按下再移动，
    // click 会被拖拽吞掉，菜单就留在原地挡视线了。
    document.addEventListener('mousedown', (event) => {
      if (attachMenu.hidden || attachWrap.contains(event.target)) return;
      closeAttachMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !attachMenu.hidden) {
        closeAttachMenu();
        attachButton.focus();
      }
    });

    attachMenu.addEventListener('click', async (event) => {
      const item = event.target.closest('.attach-item');
      if (!item || item.disabled) return;
      closeAttachMenu();
      if (item.dataset.action === 'upload') attachInput.click();
      if (item.dataset.action === 'paste') await pasteFromClipboard();
    });

    // clipboard.read 只在 HTTPS / localhost 下可用，而且浏览器会弹一次授权。
    // 拿不到就指条明路，不要在这里把人卡住——Ctrl+V 走的完全是同一条上传。
    async function pasteFromClipboard() {
      try {
        const clips = await navigator.clipboard.read();
        const files = [];
        for (const clip of clips) {
          const type = (clip.types || []).find((entry) => entry.startsWith('image/'));
          if (!type) continue;
          const blob = await clip.getType(type);
          files.push(new File([blob], 'clipboard.png', { type }));
        }
        if (!files.length) {
          setHint('剪贴板里没有图片', true);
          return;
        }
        addImageFiles(files);
      } catch (error) {
        setHint('浏览器没给剪贴板权限，在输入框里按 Ctrl+V 也一样', true);
      }
    }

    attachInput.addEventListener('change', () => {
      addImageFiles(attachInput.files);
      // 清空 value：否则连选两次同一张图不会再触发 change。
      attachInput.value = '';
    });

    // 截图工具出来的图直接粘贴就能发，比「存文件 → 点按钮 → 找文件」快得多。
    input.addEventListener('paste', (event) => {
      const files = Array.from((event.clipboardData && event.clipboardData.files) || [])
        .filter((file) => file.type.startsWith('image/'));
      if (!files.length) return;
      event.preventDefault();
      addImageFiles(files);
    });

    // 拖拽。dragover 必须 preventDefault，否则浏览器会把这个文件当成导航直接打开图片。
    const composerBox = $('#composer');
    const hasFiles = (event) => Array.from((event.dataTransfer && event.dataTransfer.types) || []).includes('Files');
    ['dragenter', 'dragover'].forEach((type) => {
      composerBox.addEventListener(type, (event) => {
        if (!hasFiles(event)) return;
        event.preventDefault();
        composerBox.classList.add('dragging');
      });
    });
    ['dragleave', 'dragend'].forEach((type) => {
      composerBox.addEventListener(type, () => composerBox.classList.remove('dragging'));
    });
    composerBox.addEventListener('drop', (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      composerBox.classList.remove('dragging');
      if (event.dataTransfer.files.length) addImageFiles(event.dataTransfer.files);
    });

    $('#composer').addEventListener('submit', (event) => { event.preventDefault(); sendMessage(input.value.trim()); });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('#composer').requestSubmit(); }
    });
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; });

    // ------------------------------------------------------------------
    // 记忆面板（E6）：AI 记住了什么——能看、能改、能删
    // ------------------------------------------------------------------
    // 每次打开都重新拉（写入方是模型，另一个标签页可能刚存了新记忆，缓存只会骗人）；
    // id 是稳定编号不是原文，所以「改完接着删」不会失手；
    // 错误写在弹窗底部、不跳 alert（alert 会掀掉用户刚敲的那行输入）。
    const memoryEntry = $('#memoryEntry');
    const memoryModal = $('#memoryModal');
    const memoryList = $('#memoryList');
    const memoryError = $('#memoryError');
    let memoryBusy = false; // 一次只放一个请求出去，防连点

    // 游客没有记忆可看，入口整个不显示——留个点了说「先登录」的按钮是噪音。
    function syncMemoryEntry() {
      memoryEntry.hidden = !identity || identity.guest;
    }

    function openMemory() {
      memoryError.textContent = '';
      memoryModal.hidden = false;
      loadMemories();
    }

    function closeMemory() {
      memoryModal.hidden = true;
      memoryError.textContent = '';
    }

    function memoryNote(message) {
      memoryError.textContent = message || '';
    }

    async function loadMemories() {
      memoryList.innerHTML = '<div class="memory-empty">正在读取…</div>';
      let items = [];
      try {
        const response = await apiFetch('/api/memories');
        if (!response.ok) {
          memoryList.innerHTML = '';
          memoryNote(`读取失败：${await readError(response, '读取失败')}`);
          return;
        }
        items = await response.json();
      } catch (error) {
        memoryList.innerHTML = '';
        memoryNote('连不上服务，稍后再试。');
        return;
      }
      renderMemories(items);
    }

    function renderMemories(items) {
      memoryList.innerHTML = '';
      if (!items.length) {
        memoryList.innerHTML = '<div class="memory-empty">还没有记住任何东西。<br>多聊几轮，它会自己开始记。</div>';
        return;
      }
      items.forEach((item) => memoryList.appendChild(memoryRow(item)));
    }

    function memoryRow(item) {
      const row = document.createElement('div');
      row.className = 'memory-row';

      const head = document.createElement('div');
      head.className = 'memory-head';
      const kind = document.createElement('span');
      // 「其他」是模型给了不认识的 kind 时的兜底，颜色压暗一点，
      // 别让它和「偏好」「身份」这些正常分类一样显眼。
      kind.className = item.kind === '其他' ? 'memory-kind other' : 'memory-kind';
      kind.textContent = item.kind || '其他';
      const hits = document.createElement('span');
      hits.className = 'memory-hits';
      // 提过几次 = 模型重复记了几次。次数高的通常是真的稳定偏好。
      hits.textContent = item.hits > 1 ? `提过 ${item.hits} 次` : '';
      head.append(kind, hits);

      const text = document.createElement('div');
      text.className = 'memory-text';
      text.textContent = item.text;

      const ops = document.createElement('div');
      ops.className = 'memory-ops';
      const edit = document.createElement('button');
      edit.className = 'memory-op';
      edit.type = 'button';
      edit.textContent = '改一下';
      edit.onclick = () => startEditing(row, item);
      const remove = document.createElement('button');
      remove.className = 'memory-op danger';
      remove.type = 'button';
      remove.textContent = '忘掉这条';
      remove.onclick = () => forgetMemory(item, remove);
      ops.append(edit, remove);

      row.append(head, text, ops);
      return row;
    }

    // 行内编辑：把这一行换成输入框，不弹第二个弹窗（弹窗套弹窗很难用）。
    function startEditing(row, item) {
      memoryNote('');
      row.innerHTML = '';
      const form = document.createElement('div');
      form.className = 'memory-edit';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = item.text;
      input.maxLength = 120;
      const ops = document.createElement('div');
      ops.className = 'memory-ops';
      const save = document.createElement('button');
      save.className = 'memory-op';
      save.type = 'button';
      save.textContent = '保存';
      const cancel = document.createElement('button');
      cancel.className = 'memory-op';
      cancel.type = 'button';
      cancel.textContent = '取消';
      const submit = () => saveMemory(item, input.value, save, cancel);
      save.onclick = submit;
      // 取消时重拉而不是把旧节点拼回去：这一来顺手也把别处的改动带回来了。
      cancel.onclick = () => loadMemories();
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { event.preventDefault(); submit(); }
        if (event.key === 'Escape') { event.preventDefault(); loadMemories(); }
      });
      ops.append(save, cancel);
      form.append(input, ops);
      row.appendChild(form);
      input.focus();
      // select() 让用户直接覆盖原文，省一次全选。不是必须的，所以判一下：
      // 真浏览器都有，但精简的 DOM 实现（测试里跑的 linkedom）没实现它。
      if (input.select) input.select();
    }

    async function saveMemory(item, text, saveButton, cancelButton) {
      const next = text.trim();
      if (!next) { memoryNote('不能改成空的。'); return; }
      // 没改就别白跑一趟服务端。
      if (next === item.text) { loadMemories(); return; }
      if (memoryBusy) return;
      memoryBusy = true;
      saveButton.disabled = true;
      cancelButton.disabled = true;
      memoryNote('');
      try {
        const response = await apiFetch(`/api/memories/${encodeURIComponent(item.id)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: next })
        });
        if (response.status === 409) { memoryNote('已经有这条了，不用再改一次。'); return; }
        if (response.status === 404) { memoryNote('这条已经不在了，刷新一下列表。'); await loadMemories(); return; }
        if (!response.ok) { memoryNote(`改失败：${await readError(response, '改失败')}`); return; }
        await loadMemories();
      } catch (error) {
        memoryNote('连不上服务，稍后再试。');
      } finally {
        memoryBusy = false;
        saveButton.disabled = false;
        cancelButton.disabled = false;
      }
    }

    async function forgetMemory(item, button) {
      if (memoryBusy) return;
      memoryBusy = true;
      button.disabled = true;
      memoryNote('');
      try {
        const response = await apiFetch(`/api/memories/${encodeURIComponent(item.id)}`, { method: 'DELETE' });
        if (response.status === 404) {
          memoryNote('这条已经不在了，刷新一下列表。');
          await loadMemories();
          return;
        }
        if (!response.ok) {
          memoryNote(`删除失败：${await readError(response, '删除失败')}`);
          return;
        }
        // 不弹二次确认：条目小、删错了再聊一轮就能重新记下来，
        // 每次都拦一下反而把「顺手清掉一条错的」这件小事变得很烦。
        await loadMemories();
      } catch (error) {
        memoryNote('连不上服务，稍后再试。');
      } finally {
        memoryBusy = false;
        button.disabled = false;
      }
    }

    $('#memoryOpen').onclick = openMemory;
    $('#memoryClose').onclick = closeMemory;
    // 点遮罩关闭。判断 target 是不是遮罩本身——不然点卡片内部也会关。
    memoryModal.addEventListener('click', (event) => {
      if (event.target === memoryModal) closeMemory();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !memoryModal.hidden) closeMemory();
    });

    // ------------------------------------------------------------------
    // 邀请码面板（F1）：只有站点主人看得到
    // ------------------------------------------------------------------
    // 「谁能发码」由服务端判定，这里只是不给不该用的人显示一个点进去挨 403 的按钮。
    const inviteEntry = $('#inviteEntry');
    const inviteModal = $('#inviteModal');
    const inviteList = $('#inviteList');
    const inviteError = $('#inviteError');
    const inviteNote = $('#inviteNote');
    const inviteMake = $('#inviteMake');
    let inviteBusy = false;

    function syncInviteEntry() {
      // 游客没有身份，普通用户不是主人——两种都不显示。
      inviteEntry.hidden = !identity || identity.guest || !identity.is_owner;
    }

    function openInvite() {
      inviteError.textContent = '';
      inviteNote.value = '';
      inviteModal.hidden = false;
      loadInvites();
    }

    function closeInvite() {
      inviteModal.hidden = true;
      inviteError.textContent = '';
    }

    function inviteNote_(message) {
      inviteError.textContent = message || '';
    }

    async function loadInvites() {
      inviteList.innerHTML = '<div class="memory-empty">正在读取…</div>';
      let items = [];
      try {
        const response = await apiFetch('/api/invites');
        if (!response.ok) {
          inviteList.innerHTML = '';
          inviteNote_(response.status === 403
            ? '这个账号不能发邀请码。'
            : `读取失败：${await readError(response, '读取失败')}`);
          return;
        }
        items = await response.json();
      } catch (error) {
        inviteList.innerHTML = '';
        inviteNote_('连不上服务，稍后再试。');
        return;
      }
      renderInvites(items);
    }

    function renderInvites(items) {
      inviteList.innerHTML = '';
      if (!items.length) {
        inviteList.innerHTML = '<div class="memory-empty">还没发过邀请码。<br>上面填个备注，生成一个发给同学。</div>';
        return;
      }
      items.forEach((item) => inviteList.appendChild(inviteRow(item)));
    }

    function inviteRow(item) {
      const row = document.createElement('div');
      // 已用的码整行压暗 + 划掉：一眼能看出还剩几个能用
      row.className = item.used ? 'memory-row invite-row used' : 'memory-row invite-row';

      const head = document.createElement('div');
      head.className = 'memory-head';
      const code = document.createElement('span');
      code.className = 'invite-code';
      code.textContent = item.code;
      const state = document.createElement('span');
      state.className = 'memory-hits';
      state.textContent = item.used ? '已用掉' : '还没人用';
      head.append(code, state);

      const meta = document.createElement('div');
      meta.className = 'memory-text';
      meta.textContent = item.note ? `备注：${item.note}` : '（没写备注）';

      row.append(head, meta);

      // 删除对已用和未用都开着，但后果不同：未用的删掉 = 立刻作废；
      // 已用的删掉 = 只丢掉「这个账号是用哪个码进来的」。只让删未用的，列表永远清不干净。
      const ops = document.createElement('div');
      ops.className = 'memory-ops';
      // 用过的码没复制的意义了，省掉按钮也少一次误点。
      if (!item.used) {
        const copy = document.createElement('button');
        copy.className = 'memory-op';
        copy.type = 'button';
        copy.textContent = '复制';
        copy.onclick = () => copyInvite(item.code, copy);
        ops.appendChild(copy);
      }
      const remove = document.createElement('button');
      remove.className = 'memory-op danger';
      remove.type = 'button';
      remove.textContent = '删除';
      remove.onclick = () => deleteInvite(item, remove);
      ops.appendChild(remove);
      row.appendChild(ops);
      return row;
    }

    async function deleteInvite(item, button) {
      const tip = item.used
        ? `删除邀请码 ${item.code}？\n\n这个码已经被用掉了。删除后「是谁用它注册的」就查不到了，但那个账号本身不受影响。`
        : `删除邀请码 ${item.code}？\n\n它还没被用过，删掉就立刻失效——拿着这个码的人将无法注册。`;
      if (!window.confirm(tip)) return;
      button.disabled = true;
      try {
        const response = await apiFetch(
          `/api/invites/${encodeURIComponent(item.code)}`,
          { method: 'DELETE' },
        );
        if (response.status === 404) {
          // 别处（另一个标签页）已经删过了。照样刷新，列表才对得上。
          inviteNote_(`${item.code} 已经不在了。`);
          await loadInvites();
          return;
        }
        if (!response.ok) {
          inviteNote_(`删除失败：${await readError(response, '删除失败')}`);
          button.disabled = false;
          return;
        }
        inviteNote_(`已删除 ${item.code}。`);
        await loadInvites();
      } catch (error) {
        inviteNote_('连不上服务，稍后再试。');
        button.disabled = false;
      }
    }

    // 剪贴板 API 在三种情况下没有：无痕/隐私模式、非 https 的页面、老浏览器。
    // **先判断再调，不要靠 catch 兜住 TypeError**——那样会把「根本没有这个 API」
    // 和「用户拒绝了授权」混成同一种情况，出问题时分不清是哪一种。
    function canCopy() {
      return typeof navigator !== 'undefined'
        && navigator.clipboard
        && typeof navigator.clipboard.writeText === 'function';
    }

    async function copyInvite(code, button) {
      if (!canCopy()) {
        inviteNote_(`复制不了，手动抄一下：${code}`);
        return;
      }
      try {
        await navigator.clipboard.writeText(code);
        const original = button.textContent;
        button.textContent = '已复制';
        window.setTimeout(() => { button.textContent = original; }, 1400);
        inviteNote_('');
      } catch (error) {
        // 浏览器明确拒绝（权限、非安全上下文）。同样把码写出来让人手抄。
        inviteNote_(`复制不了，手动抄一下：${code}`);
      }
    }

    async function makeInvite() {
      if (inviteBusy) return;
      inviteBusy = true;
      inviteMake.disabled = true;
      inviteNote_('');
      try {
        const response = await apiFetch('/api/invites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // 备注可以空着；空着传 null 而不是空字符串，免得库里存一堆 ''。
          body: JSON.stringify({ note: inviteNote.value.trim() || null })
        });
        if (response.status === 403) { inviteNote_('这个账号不能发邀请码。'); return; }
        if (!response.ok) {
          inviteNote_(`生成失败：${await readError(response, '生成失败')}`);
          return;
        }
        const created = await response.json();
        inviteNote.value = '';
        await loadInvites();
        // 生成完顺手复制：这一步几乎总是紧接着「发给同学」，省掉再点一次。
        // 复制失败也只是提示，不影响「码已经生成」这个事实。
        if (canCopy()) {
          try {
            await navigator.clipboard.writeText(created.code);
            inviteNote_(`已生成并复制：${created.code}`);
          } catch (error) {
            inviteNote_(`已生成：${created.code}（复制不了，手动抄一下）`);
          }
        } else {
          inviteNote_(`已生成：${created.code}（复制不了，手动抄一下）`);
        }
      } catch (error) {
        inviteNote_('连不上服务，稍后再试。');
      } finally {
        inviteBusy = false;
        inviteMake.disabled = false;
      }
    }

    $('#inviteOpen').onclick = openInvite;
    $('#inviteClose').onclick = closeInvite;
    inviteMake.onclick = makeInvite;
    inviteNote.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); makeInvite(); }
    });
    inviteModal.addEventListener('click', (event) => {
      if (event.target === inviteModal) closeInvite();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !inviteModal.hidden) closeInvite();
    });

    $('#newChat').onclick = newConversation;
    document.querySelectorAll('.suggestion').forEach((button) => { button.onclick = () => { input.value = button.dataset.prompt; input.focus(); }; });
    renderLocateButton();
    restoreLocation();
    restoreToggles();
    bindToggle('#toggleReasoning', 'reasoning');
    bindToggle('#toggleWeb', 'web_search');
    paintToggles();
    // **先问服务端「我是谁」，再按身份拉列表**。顺序反了会先按游客拉一次
    // （本地有令牌时那次请求还是会带上令牌，但界面上会先闪一下游客态）。
    (async () => {
      await refreshIdentity();
      await loadConversations();
      await loadCapabilities();
    })();
  </script>
</body>
</html>
