<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书院 · 教材问答</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20width%3D'32'%20height%3D'32'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'6'%20fill%3D'%239c3a29'/%3E%3Cpath%20d%3D'M16%2010.6C14.2%209.3%2011.9%208.7%209.4%208.7c-.9%200-1.7.1-2.4.2v12.6c.7-.1%201.5-.2%202.4-.2%202.5%200%204.8.6%206.6%201.9%201.8-1.3%204.1-1.9%206.6-1.9.9%200%201.7.1%202.4.2V8.9c-.7-.1-1.5-.2-2.4-.2-2.5%200-4.8.6-6.6%201.9Z'%20stroke%3D'%23fffaf2'%20stroke-width%3D'1.8'%20stroke-linejoin%3D'round'%20fill%3D'none'/%3E%3Cpath%20d%3D'M16%2010.6v12.6'%20stroke%3D'%23fffaf2'%20stroke-width%3D'1.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/theme.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6.6C10.4 5.3 8.4 4.7 6 4.7c-.8 0-1.5.1-2.2.2v12.9c.7-.1 1.4-.2 2.2-.2 2.4 0 4.4.6 6 1.9 1.6-1.3 3.6-1.9 6-1.9.8 0 1.5.1 2.2.2V4.9C19.5 4.8 18.8 4.7 18 4.7c-2.4 0-4.4.6-6 1.9Z"/>
            <path d="M12 6.6v12.9"/>
          </svg>
        </div>
        <div class="brand-name">书院</div>
      </div>
      <div class="account">
        <div class="account-line">
          <div class="account-who">
            <div class="account-name" id="accountName">未登录</div>
            <div class="account-note" id="accountNote">游客模式 · 不记录长期记忆</div>
          </div>
          <button class="account-action" id="accountAction" type="button">登录 / 注册</button>
        </div>
      </div>
      <button class="new-chat" id="newChat">＋ 新建会话</button>
      <div class="section-label">Conversations · 右键管理</div>
      <div class="conversation-list" id="conversationList"></div>
      
      <a class="library-entry" id="libraryEntry" href="/library">藏书阁 · 教材与分类</a>
      
      <div class="memory-entry" id="memoryEntry" hidden>
        <button class="memory-open" id="memoryOpen" type="button">查看 AI 记住了什么</button>
      </div>
      
      <div class="memory-entry" id="inviteEntry" hidden>
        <button class="memory-open" id="inviteOpen" type="button">邀请同学加入</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="打开会话列表">☰</button>
        <div class="conversation-heading" id="conversationTitle">未选择会话</div>
        <button class="scope-badge" id="scopeBadge" type="button" hidden title="退出聚焦，恢复全书检索"></button>
      </header>
      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <h1>读万卷书，行万里路。</h1>
          <div class="suggestions">
            <button class="suggestion" data-prompt="帮我梳理一下知识库里这本教材的章节结构">梳理教材章节</button>
            <button class="suggestion" data-prompt="讲讲信号与系统里傅里叶变换的物理意义">问一个概念</button>
            <button class="suggestion" data-prompt="我这里今天的天气怎么样？">查一下天气</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>
      <div class="composer-wrap">
        <button class="scroll-bottom" id="scrollBottom" type="button" title="回到底部" aria-label="回到底部">↓</button>
        <form class="composer" id="composer">
          <div class="composer-attachments" id="composerAttachments" hidden></div>
          <div class="composer-main">
            <textarea id="input" rows="1" placeholder=""></textarea>
            <button class="send" id="send" title="发送" aria-label="发送">↑</button>
          </div>
          <div class="composer-tools">
            <div class="attach-wrap" id="attachWrap">
              <button class="attach" id="attachButton" type="button" title="添加" aria-label="添加" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
              </button>
              <div class="attach-menu" id="attachMenu" role="menu" hidden>
                <div class="attach-menu-label">添加</div>
                <button class="attach-item" type="button" role="menuitem" data-action="upload">
                  <span class="attach-icon">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
                      <circle cx="8.6" cy="10" r="1.5"/>
                      <path d="M4 17.2l4.6-4.6a2 2 0 0 1 2.8 0L16.2 18"/>
                    </svg>
                  </span>
                  <span class="attach-text"><b>上传图片</b><small>JPG / PNG / WebP，也可以直接拖进来</small></span>
                </button>
                <button class="attach-item" type="button" role="menuitem" data-action="paste">
                  <span class="attach-icon">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect x="7" y="4" width="10" height="3.4" rx="1.2"/>
                      <path d="M9 5.4H5.8A1.8 1.8 0 0 0 4 7.2v12.1A1.8 1.8 0 0 0 5.8 21h12.4a1.8 1.8 0 0 0 1.8-1.7V7.2a1.8 1.8 0 0 0-1.8-1.8H15"/>
                    </svg>
                  </span>
                  <span class="attach-text"><b>从剪贴板粘贴</b><small>截完图直接加，省一步存文件</small></span>
                </button>
                <button class="attach-item" type="button" role="menuitem" disabled>
                  <span class="attach-icon">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/>
                      <path d="M14 3.5V8.5h5"/>
                    </svg>
                  </span>
                  <span class="attach-text"><b>上传教材文档</b><small>PDF / PPT / Word</small></span>
                  <span class="attach-tag">即将支持</span>
                </button>
              </div>
            </div>
            <button class="locate" id="locate" type="button" title="设置位置">定位</button>
            <button class="toggle" id="toggleReasoning" type="button" aria-pressed="true"><span class="dot"></span>深度思考</button>
            <button class="toggle" id="toggleWeb" type="button" aria-pressed="true"><span class="dot"></span>联网搜索</button>
          </div>
        </form>
        <input type="file" id="attachInput" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden />
        <div class="hint">Enter 发送 · Shift + Enter 换行</div>
      </div>
    </main>
  </div>
  <div class="modal" id="authModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authSubmit">
      <button class="modal-close" id="authClose" type="button" aria-label="关闭">×</button>
      <div class="modal-tabs">
        <button class="modal-tab active" type="button" data-mode="login">登录</button>
        <button class="modal-tab" type="button" data-mode="register">注册</button>
      </div>
      <form id="authForm">
        <label class="field"><span>账号</span><input id="authAccount" type="text" autocomplete="username" placeholder="用户名 / 手机号 / 邮箱" /></label>
        <label class="field"><span>密码</span><input id="authPassword" type="password" autocomplete="current-password" placeholder="你的密码" /></label>
        
        <label class="field" id="authInviteField" hidden>
          <span>邀请码</span>
          <input id="authInvite" type="text" autocomplete="off" placeholder="AW-XXXX-XXXX" />
        </label>
        <div class="modal-error" id="authError" role="alert"></div>
        <button class="modal-submit" id="authSubmit" type="submit">登录</button>
      </form>
    </div>
  </div>
  <div class="context-menu" id="conversationMenu" role="menu" hidden>
    <button type="button" class="context-menu-item" role="menuitem" data-action="rename">重命名</button>
    <button type="button" class="context-menu-item danger" role="menuitem" data-action="delete">删除会话</button>
  </div>
  
  <div class="modal" id="memoryModal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="memoryTitle">
      <button class="modal-close" id="memoryClose" type="button" aria-label="关闭">×</button>
      <h2 class="modal-title" id="memoryTitle">AI 记住了什么</h2>
      <p class="modal-sub">这些内容会跨会话保留。改掉或者删掉，之后就不会再拿来用了。</p>
      <div class="memory-list" id="memoryList"></div>
      <div class="memory-err" id="memoryError" role="alert"></div>
    </div>
  </div>
  
  <div class="modal" id="inviteModal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="inviteTitle">
      <button class="modal-close" id="inviteClose" type="button" aria-label="关闭">×</button>
      <h2 class="modal-title" id="inviteTitle">邀请同学加入</h2>
      <p class="modal-sub">一个邀请码只能注册一个账号，用过就作废。把码发给同学，他在注册时填进去就行。<br>发错了或者不想给了，点那一行的「删除」——没被用过的码会立刻失效。</p>
      <div class="invite-new">
        <input id="inviteNote" type="text" maxlength="40" placeholder="备注（比如：给室友小李）" />
        <button class="invite-make" id="inviteMake" type="button">生成邀请码</button>
      </div>
      <div class="memory-list" id="inviteList"></div>
      <div class="memory-err" id="inviteError" role="alert"></div>
    </div>
  </div>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/vendor/katex/auto-render.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
